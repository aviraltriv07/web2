<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SciFiLens | Physics at the Movies</title>
<style>
:root{--bg:#f6f7f9;--fg:#14181f;--mu:#5b6573;--cd:#fff;--bd:#d9dee5;--ac:#2563eb;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#e8ecf2;--mu:#98a3b3;--cd:#14171c;--bd:#262b33;--ac:#6ea8ff}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#e8ecf2;--mu:#98a3b3;--cd:#14171c;--bd:#262b33;--ac:#6ea8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main,footer{max-width:1180px;margin:auto;padding:16px}
h1{margin:0;font-size:1.5rem}h2{margin:0;font-size:1.2rem}p{margin:.3rem 0}.mu{color:var(--mu)}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;max-width:1180px;margin:auto}
button{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav button{flex:none}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
main{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}}
canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;border:1px solid var(--bd);touch-action:none;background:#0b0f14}
.panel{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px}
label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:10px 0;font-size:.85rem}
label input{grid-column:1/3;width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:8px}
.ro{white-space:pre-line;line-height:1.65;font-size:.88rem;color:var(--ac);min-height:8em;font-variant-numeric:tabular-nums;margin-top:12px}
footer{color:var(--mu);font-size:.8rem}
body.embedded{min-height:100vh;background:#080d18}
body.embedded header,body.embedded footer{display:none}
body.embedded nav{max-width:none;padding:10px 12px 12px}
body.embedded main{max-width:none;padding:0 12px 12px;gap:12px}
body.embedded .panel{max-height:74vh;overflow:auto}
body.embedded canvas{min-height:280px}
</style></head><body>
<header><h1>🎬 Physics at the Movies</h1><p class="mu">15 interactive simulations of the real science behind famous film scenes.</p></header>
<nav id="nav"></nav>
<main>
<canvas id="cv" width="1600" height="900"></canvas>
<section class="panel"><h2 id="ti"></h2><p id="mv" class="mu"></p><p id="ds"></p><div id="ctl"></div>
<div class="row"><button id="rb">⟲ Restart</button><button id="pb">⏸ Pause</button></div><p id="ro" class="ro"></p></section>
</main>
<footer>Original simulations in the spirit of simuphysics.com’s topic categories. Pure canvas + JavaScript, no dependencies. Film scenes are dramatized; the physics is real.</footer>
<script>
const R=Math.random,PI=Math.PI,sin=Math.sin,cos=Math.cos,sqrt=Math.sqrt,abs=Math.abs,W=800,H=450,$=s=>document.querySelector(s);
const cv=$('#cv'),g=cv.getContext('2d');g.scale(2,2);
let P,X,cur,paused=0,last=0;
const pageParams=new URLSearchParams(location.search),embedMode=pageParams.get('embed')==='1';
if(embedMode){document.documentElement.dataset.theme='dark';document.body.classList.add('embedded')}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const dot=(x,y,r,c)=>{g.fillStyle=g.shadowColor=c;g.shadowBlur=r*2+3;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0};
const ln=(a,b,c,d,s='#8895a7',w=1)=>{g.strokeStyle=s;g.lineWidth=w;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};
const tx=(s,x,y,c='#cfd8e3',a='left')=>{g.fillStyle=c;g.textAlign=a;g.font='13px system-ui,sans-serif';g.fillText(s,x,y)};
const poly=(a,c,w=2,o=[0,0])=>{if(a.length<2)return;g.strokeStyle=g.shadowColor=c;g.shadowBlur=7;g.lineWidth=w;g.beginPath();a.forEach((p,i)=>i?g.lineTo(p[0]+o[0],p[1]+o[1]):g.moveTo(p[0]+o[0],p[1]+o[1]));g.stroke();g.shadowBlur=0};
const fmt=n=>n>=1e5?n.toExponential(1):n>=100?n.toFixed(0):n>=1?n.toFixed(1):n.toFixed(2);
const reset=()=>{X={};cur.i&&cur.i()};
const clk=(x,y,a,l)=>{g.strokeStyle='#cfd8e3';g.lineWidth=2;g.beginPath();g.arc(x,y,36,0,7);g.stroke();ln(x,y,x+30*sin(a),y-30*cos(a),'#ff9f43',3);tx(l,x,y+58,'#98a3b3','center')};

const S=[
{n:'Gravitational Time Dilation',m:'Interstellar',e:'🕳️',d:'Near a black hole, clocks tick slower: dτ = dt·√(1 − rₛ/r). On Miller’s planet an hour cost seven years back home. Slide closer to the horizon.',
p:[['q','Closeness to horizon',0,11,4,.1]],
f(dt){X.t=(X.t||0)+dt;const r=1+10**(.6-P.q),k=sqrt(1-1/r),nx=170+50*r;
 dot(100,225,50,'#000');g.strokeStyle='#ffb84d';g.lineWidth=5;g.beginPath();g.ellipse(100,225,92,20,-.3,0,7);g.stroke();
 clk(nx,225,X.t*k*2.2,'Near the hole');clk(690,225,X.t*2.2,'Far away');
 const t=1/k;return `1 hour near the hole = ${t<1e3?fmt(t)+' hours':fmt(t/8766)+' years'} far away`}},

{n:'Orbital Mechanics',m:'Apollo 13 / Gravity',e:'🛰️',d:'Gravity bends a spacecraft’s path into a conic section. Too slow and you re-enter; just right and you orbit; too fast and you escape.',
p:[['v','Burn speed (× circular)',.3,1.5,.85,.01]],rs:1,
i(){X={x:150,y:0,vx:0,vy:P.v*60,tr:[]}},
f(dt){const s=X,GM=540000;if(!s.end){for(let k=0;k<20;k++){const h=dt/20,r2=s.x*s.x+s.y*s.y,a=-GM/(r2*sqrt(r2));s.vx+=a*s.x*h;s.vy+=a*s.y*h;s.x+=s.vx*h;s.y+=s.vy*h}
 s.tr.push([s.x,s.y]);if(s.tr.length>600)s.tr.shift();const r=sqrt(s.x*s.x+s.y*s.y);
 if(r<22)s.end='💥 Re-entry: the burn was too weak';if(r>560)s.end='🚀 Escaped to deep space'}
 dot(400,225,22,'#2d6cdf');poly(s.tr,'#ffb84d88',1.5,[400,225]);dot(400+s.x,225+s.y,4,'#fff');
 return s.end||`Altitude ${fmt(sqrt(s.x*s.x+s.y*s.y)-22)} · speed ${fmt(sqrt(s.vx*s.vx+s.vy*s.vy))} (circular = 60)`}},

{n:'Ramp Jump Projectile',m:'Fast & Furious',e:'🚗',d:'A car leaves the ramp as a projectile. Range depends on speed and angle (R = v²·sin2θ / g); air drag shortens it. Clear the gap to the far platform.',
p:[['v','Launch speed (m/s)',10,50,38,1],['a','Ramp angle (°)',0,45,20,1],['k','Air drag',0,.02,0,.002]],rs:1,
i(){const a=P.a*PI/180;X={x:0,y:0,vx:P.v*cos(a),vy:P.v*sin(a),tr:[]}},
f(dt){const s=X,sc=6,gx=40,gy=380;
 if(!s.end){for(let k=0;k<4;k++){const h=dt/4,v=sqrt(s.vx*s.vx+s.vy*s.vy);s.vx-=P.k*v*s.vx*h;s.vy-=(9.8+P.k*v*s.vy)*h;s.x+=s.vx*h;s.y+=s.vy*h;
  if(s.y<=0&&s.vy<0){s.end=s.x>=70&&s.x<=125?`✅ Clean landing at ${s.x|0} m`:s.x<70?`💦 Fell short at ${s.x|0} m`:`💨 Overshot at ${s.x|0} m`;break}}
  s.tr.push([s.x,s.y])}
 g.fillStyle='#1e4f7a';g.fillRect(0,400,W,50);g.fillStyle='#4a5565';g.fillRect(0,gy,gx,70);g.fillRect(gx+70*sc,gy,55*sc,70);
 s.tr.forEach(p=>dot(gx+p[0]*sc,gy-p[1]*sc,1.5,'#ffb84d'));g.fillStyle='#e23d3d';g.fillRect(gx+s.x*sc-9,gy-s.y*sc-9,18,8);
 return s.end||`Distance ${s.x|0} m · height ${fmt(s.y)} m`}},

{n:'Ripple Interference',m:'Jurassic Park',e:'🦖',d:'The T. rex footsteps shake the water in the cup. Two wave sources interfere constructively and destructively. Click or drag the water to add a footstep.',
p:[['f','Frequency',.15,.5,.3,.01],['s','Source spacing',3,20,10,1]],
i(){X={u:new Float32Array(5600),v:new Float32Array(5600),s:0}},
q(x,y){X.u[cl(y/8|0,1,54)*100+cl(x/8|0,1,98)]=5},
f(dt){const{u,v}=X;for(let n=0;n<(dt?3:0);n++){X.s++;for(let y=1;y<55;y++)for(let x=1;x<99;x++){const k=y*100+x;v[k]+=.25*(u[k-1]+u[k+1]+u[k-100]+u[k+100]-4*u[k])}
 for(let k=0;k<5600;k++){v[k]*=.995;u[k]+=v[k]}const a=2*sin(X.s*P.f);u[(28-P.s)*100+15]=a;u[(28+P.s)*100+15]=a}
 for(let y=0;y<56;y++)for(let x=0;x<100;x++){g.fillStyle=`hsl(205 85% ${cl(30+u[y*100+x]*18,4,92)}%)`;g.fillRect(x*8,y*8,8.5,8.5)}
 dot(124,(28-P.s)*8+4,4,'#ffb84d');dot(124,(28+P.s)*8+4,4,'#ffb84d');return `Wavelength ≈ ${fmt(.5*2*PI/P.f)} cells · click to splash`}},

{n:'Charged Particle in a Magnetic Field',m:'Iron Man (arc reactor)',e:'⚛️',d:'Magnetic fields bend moving charges into circles (r = mv/qB). Add an electric field and the orbit drifts sideways (E×B drift), the principle behind tokamak reactors.',
p:[['B','Magnetic field B',.2,3,1,.05],['v','Particle speed',40,200,100,5],['E','Electric field E',0,1.5,0,.05]],rs:1,
i(){X={x:400,y:225,vx:P.v,vy:0,tr:[]}},
f(dt){const s=X;for(let k=0;k<8;k++){const h=dt/8,c=cos(P.B*h),n=sin(P.B*h),a=s.vx*c+s.vy*n;s.vy=-s.vx*n+s.vy*c;s.vx=a;s.vy+=P.E*50*h;s.x+=s.vx*h;s.y+=s.vy*h}
 s.tr.push([s.x,s.y]);if(s.tr.length>700)s.tr.shift();
 for(let a=40;a<800;a+=80)for(let b=40;b<450;b+=80)tx('×',a,b,'#2a3a55','center');
 poly(s.tr,'#5ee7ff',2);dot(s.x,s.y,5,'#fff');if(s.x<-20||s.x>820||s.y<-20||s.y>470){reset();return}
 return `Larmor radius r = mv/qB ≈ ${fmt(P.v/P.B)} px · drift speed E/B ≈ ${fmt(50*P.E/P.B)}`}},

{n:'Electric Field Lines',m:'Thor / Spider-Man 2 (Electro)',e:'⚡',d:'Field lines leave positive charges and enter negative ones. Like charges repel, opposites attract with F ∝ q₁q₂/d². Change the charges and spacing.',
p:[['a','Charge 1',-3,3,2,1],['b','Charge 2',-3,3,-2,1],['d','Separation',60,300,200,10]],
f(dt){X.t=(X.t||0)+dt;const d=P.d,cs=[[400-d/2,225,P.a],[400+d/2,225,P.b]];g.setLineDash([7,6]);
 cs.forEach(([cx,cy,q])=>{if(!q)return;const sg=q>0?1:-1,N=Math.round(abs(q)*8);
  for(let i=0;i<N;i++){let x=cx+12*cos(2*PI*i/N+.3),y=cy+12*sin(2*PI*i/N+.3);const pts=[[x,y]];
   for(let k=0;k<260;k++){let ex=0,ey=0;for(const c of cs){const dx=x-c[0],dy=y-c[1],r2=dx*dx+dy*dy+1,r3=r2*sqrt(r2);ex+=c[2]*dx/r3;ey+=c[2]*dy/r3}
    const m=sqrt(ex*ex+ey*ey)||1;x+=sg*5*ex/m;y+=sg*5*ey/m;pts.push([x,y]);
    if(x<0||x>W||y<0||y>H||cs.some(c=>c[2]&&(x-c[0])**2+(y-c[1])**2<100))break}
   g.lineDashOffset=-X.t*30*sg;poly(pts,q>0?'#ff7b7b':'#6fb3ff',1.6)}});
 g.setLineDash([]);cs.forEach(([cx,cy,q])=>{if(q){dot(cx,cy,10,q>0?'#e23d3d':'#2b6cd7');tx(q>0?'+':'−',cx,cy+5,'#fff','center')}});
 return P.a*P.b>0?'Like charges: they repel':P.a*P.b<0?'Opposite charges: they attract':'Only one charge active'}},

{n:'The Square–Cube Law',m:'Ant-Man',e:'🐜',d:'Strength grows with cross-section (size²) but weight grows with volume (size³). Shrink and you get relatively stronger, which is why ants lift many times their weight.',
p:[['x','Height (log₁₀ metres)',-2.5,.5,.26,.01]],
f(){const h=10**P.x,s=h/1.8,hp=30+(P.x+2.5)*115,fx=130,fy=400,ink='#cfd8e3';
 dot(fx,fy-hp,hp*.08+3,'#e23d3d');ln(fx,fy-hp*.9,fx,fy-hp*.45,ink,3);ln(fx,fy-hp*.45,fx-hp*.15,fy,ink,3);ln(fx,fy-hp*.45,fx+hp*.15,fy,ink,3);ln(fx-hp*.2,fy-hp*.7,fx+hp*.2,fy-hp*.7,ink,3);ln(0,fy,260,fy,'#4a5565',2);
 ln(560,95,560,380,'#8895a7');tx('human size = ×1',560,85,'#98a3b3','center');
 [['Strength (∝ size²)',s**2,'#6fe27f'],['Weight (∝ size³)',s**3,'#ff7b7b'],['Strength ÷ weight (∝ 1/size)',1/s,'#ffb84d']].forEach(([l,v,c],i)=>{const y=125+i*85,w=60*Math.log10(v);tx(l,380,y-10,'#98a3b3');g.fillStyle=c;g.fillRect(560,y,w,26);tx('×'+fmt(v),w>0?570+w:568,y+18,'#fff')});
 const sz=h<.01?fmt(h*1e3)+' mm':h<1?fmt(h*100)+' cm':fmt(h)+' m';return `${sz} tall · lifts ${fmt(1/s)}× its own weight (log scale)`}},

{n:'Doppler Effect & Sonic Boom',m:'Top Gun: Maverick',e:'✈️',d:'Waves bunch up in front of a moving source (Doppler). At Mach 1 they pile into a shock wave; above it they form a cone with sin μ = 1/Mach: the sonic boom.',
p:[['m','Mach number',0,3,.8,.05]],
i(){X={x:60,w:[],e:0}},
f(dt){const s=X,c=100,M=P.m;s.x+=M*c*dt;s.e+=dt;if(s.e>.1){s.e=0;s.w.push([s.x,0])}
 s.w.forEach(w=>w[1]+=dt);s.w=s.w.filter(w=>w[1]*c<700);if(s.x>W+30){s.x=-30;s.w=[]}
 s.w.forEach(([x,a])=>{g.strokeStyle='#6fb3ff99';g.lineWidth=1;g.beginPath();g.arc(x,225,a*c,0,7);g.stroke()});
 let r='Subsonic: waves bunch up ahead (higher pitch in front, lower behind)';
 if(M>=1){const m=Math.asin(1/M);ln(s.x,225,s.x-700*cos(m),225-700*sin(m),'#ffb84d',2);ln(s.x,225,s.x-700*cos(m),225+700*sin(m),'#ffb84d',2);r=`💥 Mach cone half-angle ${(m*180/PI).toFixed(1)}° · sonic boom`}
 dot(s.x,225,6,'#fff');return r}},

{n:'Artificial Gravity',m:'2001: A Space Odyssey',e:'🌀',d:'A spinning station presses crew against the rim with centripetal acceleration a = ω²r. Tune radius and spin rate until it feels like 1 g.',
p:[['R','Radius (m)',50,1000,224,1],['r','Spin (rpm)',.5,6,2,.1]],
f(dt){const w=2*PI*P.r/60,gg=w*w*P.R/9.8;X.a=(X.a||0)+w*dt*3;
 g.strokeStyle='#5b6b82';g.lineWidth=26;g.beginPath();g.arc(300,225,150,0,7);g.stroke();
 for(let k=0;k<3;k++){const a=X.a+k*2*PI/3;ln(300,225,300+150*cos(a),225+150*sin(a),'#5b6b82',4)}
 dot(300,225,16,'#8895a7');const a=X.a+.8;ln(300+137*cos(a),225+137*sin(a),300+107*cos(a),225+107*sin(a),'#ff9f43',5);dot(300+100*cos(a),225+100*sin(a),6,'#ff9f43');
 tx('Gravity felt',620,120,'#98a3b3','center');g.fillStyle='#262b33';g.fillRect(600,140,40,230);const h=Math.min(gg,2)/2*230;
 g.fillStyle=gg<.8?'#ffb84d':gg>1.3?'#ff7b7b':'#6fe27f';g.fillRect(600,370-h,40,h);ln(590,255,650,255,'#fff',2);tx('1 g',660,259);
 return `${fmt(gg)} g at the rim · ω = ${w.toFixed(2)} rad/s`+(P.r>4?' · ⚠️ dizzying Coriolis effect':'')}},

{n:'Buoyancy & Sinking',m:'Titanic',e:'🚢',d:'Archimedes: a hull floats while its average density is below water’s. Flooded compartments raise the average density until the ship goes under.',
p:[['d','Average density (water = 1)',.2,1.4,.5,.01]],rs:1,
i(){X={y:30,v:0}},
f(dt){const s=X,d=P.d;for(let k=0;k<4;k++){const h=dt/4,sb=cl((s.y+90-250)/90,0,1);s.v+=300*(1-sb/d)*h;s.v*=1-2.5*h;s.y+=s.v*h;if(s.y>350){s.y=350;s.v=0}}
 g.fillStyle='#dbe7f3';g.beginPath();g.moveTo(600,250);g.lineTo(660,150);g.lineTo(730,250);g.fill();
 g.fillStyle=d>1?'#7a2e2e':'#c9d3df';g.fillRect(280,s.y,240,90);tx('TITANIC',400,s.y+52,'#0b0f14','center');
 g.fillStyle='#1e5fa066';g.fillRect(0,250,W,200);ln(0,250,W,250,'#6fb3ff',2);
 return `Average density ${d.toFixed(2)} × water: `+(d<1?`floats, ${d*100|0}% submerged`:'sinks. Flooding raised the density')}},

{n:'Asteroid Impact Energy',m:'Armageddon',e:'☄️',d:'Impact energy E = ½mv² grows with the cube of diameter and the square of speed. Compare it with nuclear bombs and the dinosaur-killing impact.',
p:[['x','Diameter (log₁₀ metres)',1,4,2.7,.05],['v','Speed (km/s)',5,70,20,1]],
f(dt){X.t=((X.t||0)+dt)%4.5;const t=X.t,x=P.x,d=10**x,m=3000*PI/6*d**3,Mt=.5*m*(P.v*1e3)**2/4.184e15;
 g.fillStyle='#1b3a66';g.beginPath();g.arc(400,1100,740,0,7);g.fill();
 if(t<2){const k=t/2,ax=60+340*k,ay=30+330*k;ln(ax,ay,ax-50,ay-50,'#ffb84d99',4+x);dot(ax,ay,3+x*2.5,'#c9a27a')}
 else{const e=t-2;g.globalAlpha=cl(1-e/2.5,0,1);dot(400,350,10+x*14*Math.min(e*2,1),'#ffb84d');g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(400,360,e*(70+x*40),0,7);g.stroke();g.globalAlpha=1}
 return `Diameter ${fmt(d)} m · energy ${fmt(Mt)} Mt TNT ≈ ${fmt(Mt/.015)} Hiroshima bombs (dinosaur-killer ≈ 10⁸ Mt)`}},

{n:'Double-Slit Experiment',m:'Ant-Man: Quantum Realm',e:'🌌',d:'Single particles build an interference pattern, as if each passed through both slits. Watch which slit it uses and the pattern disappears.',
p:[['l','Wavelength (nm)',400,700,550,10],['d','Slit separation (µm)',2,10,5,.5],['w','Which-slit detector (0 off, 1 on)',0,1,0,1]],rs:1,
i(){X={b:new Array(150).fill(0),n:0}},
f(dt){const s=X,e=P.l/1e3,I=y=>{const A=PI*P.d*y/e,B=PI*y/e;return(P.w?1:cos(A)**2)*(B?(sin(B)/B)**2:1)};
 if(dt)for(let k=0;k<80;k++){const y=R()*2-1;if(R()<I(y)){s.b[cl((y+1)*75|0,0,149)]++;s.n++}}
 const mx=Math.max(1,...s.b),y1=225-P.d*8,y2=225+P.d*8;dot(50,225,6,'#ffb84d');
 g.fillStyle='#8895a7';g.fillRect(247,0,6,y1-4);g.fillRect(247,y1+4,6,y2-y1-8);g.fillRect(247,y2+4,6,450-y2-4);
 ln(50,225,250,y1,'#ffb84d66');ln(50,225,250,y2,'#ffb84d66');for(let j=0;j<5;j++){ln(250,y1,560,40+j*90,'#6fb3ff2a');ln(250,y2,560,40+j*90,'#6fb3ff2a')}
 ln(560,0,560,450,'#cfd8e3');s.b.forEach((c,j)=>{g.fillStyle='#6fe27f';g.fillRect(562,j*3,c/mx*210,2.6)});
 poly(Array.from({length:150},(_,j)=>[562+I((j+.5)/75-1)*210,j*3+1]),'#ffffff66',1);
 return `${s.n} particles detected · `+(P.w?'watched: no interference, particles act like bullets':'unwatched: wave interference fringes')}},

{n:'Nuclear Chain Reaction',m:'Oppenheimer',e:'☢️',d:'Each fission releases 2–3 neutrons that can split more nuclei. If more than one survives per fission the reaction runs away. Insert control rods to tame it.',
